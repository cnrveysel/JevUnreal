; Example Jev settings. Copy the section below into your project's
; Config/DefaultEngine.ini and replace placeholders. Do NOT commit real keys.

[/Script/Jev.JevSettings]
; TypeSafe endpoint (default shown)
Endpoint=https://api.typesafe.ai/v1/systemone
Model=jev-latest
; DEVELOPMENT ONLY: never ship or commit this value
ApiKey=YOUR_TYPESAFE_API_KEY_PLACEHOLDER
RequestTimeoutSeconds=30
bDebugLogging=True

; Production: route through your own backend instead
; bUseProxy=True
; ProxyEndpoint=https://your-backend.example.com/jev
